<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoTrader Pro - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        .header {
            background: #161b22;
            padding: 20px 30px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #58a6ff; font-size: 24px; }
        .header .status { color: #3fb950; font-size: 14px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
        }
        .card h3 { color: #58a6ff; margin-bottom: 15px; font-size: 16px; }
        .signal-card {
            border-left: 4px solid #30363d;
            transition: all 0.3s;
        }
        .signal-card.buy { border-left-color: #3fb950; }
        .signal-card.sell { border-left-color: #f85149; }
        .signal-card.hold { border-left-color: #d29922; }
        .signal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .pair-name { font-size: 18px; font-weight: bold; color: #f0f6fc; }
        .action-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
        }
        .action-badge.buy { background: #238636; color: white; }
        .action-badge.sell { background: #da3633; color: white; }
        .action-badge.hold { background: #9e6a03; color: white; }
        .confidence-bar {
            height: 8px;
            background: #21262d;
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }
        .confidence-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s;
        }
        .confidence-fill.high { background: #3fb950; }
        .confidence-fill.medium { background: #d29922; }
        .confidence-fill.low { background: #f85149; }
        .signal-details { font-size: 13px; color: #8b949e; }
        .signal-details .row { display: flex; justify-content: space-between; padding: 3px 0; }
        .signal-details .label { color: #8b949e; }
        .signal-details .value { color: #c9d1d9; font-weight: 500; }
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover { background: #2ea043; }
        .btn.scanning { background: #d29922; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: bold; color: #f0f6fc; }
        .stat-label { font-size: 12px; color: #8b949e; margin-top: 5px; }
        .stat-value.positive { color: #3fb950; }
        .stat-value.negative { color: #f85149; }
        .loading { text-align: center; padding: 40px; color: #8b949e; }
        .indicator-list { max-height: 300px; overflow-y: auto; }
        .indicator-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #21262d;
            font-size: 13px;
        }
        .indicator-signal { font-weight: bold; }
        .indicator-signal.STRONG_BUY, .indicator-signal.BUY { color: #3fb950; }
        .indicator-signal.STRONG_SELL, .indicator-signal.SELL { color: #f85149; }
        .indicator-signal.NEUTRAL { color: #d29922; }
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>CryptoTrader Pro</h1>
        <div>
            <span class="status" id="status">Ready</span>
            <button class="btn" id="scanBtn" onclick="scanMarkets()">Scan Markets</button>
        </div>
    </div>

    <div class="container">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="totalSignals">-</div>
                <div class="stat-label">Signals Scanned</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="buySignals">-</div>
                <div class="stat-label">Buy Signals</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="sellSignals">-</div>
                <div class="stat-label">Sell Signals</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="bestSignal">-</div>
                <div class="stat-label">Best Confidence</div>
            </div>
        </div>

        <div class="grid" id="signalsGrid">
            <div class="loading">Click "Scan Markets" to analyze all pairs</div>
        </div>

        <div class="card" id="detailsCard" style="display:none; margin-top: 20px;">
            <h3>Indicator Details — <span id="detailsPair"></span></h3>
            <div class="indicator-list" id="indicatorList"></div>
        </div>
    </div>

    <script>
        async function scanMarkets() {
            const btn = document.getElementById('scanBtn');
            const status = document.getElementById('status');
            btn.textContent = 'Scanning...';
            btn.classList.add('scanning');
            status.textContent = 'Scanning markets...';

            try {
                const resp = await fetch('/api/scan');
                const data = await resp.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }

                renderSignals(data.signals);
                updateStats(data.signals);
                status.textContent = 'Last scan: ' + new Date().toLocaleTimeString();
            } catch (e) {
                alert('Scan failed: ' + e.message);
            } finally {
                btn.textContent = 'Scan Markets';
                btn.classList.remove('scanning');
            }
        }

        function renderSignals(signals) {
            const grid = document.getElementById('signalsGrid');
            grid.innerHTML = signals.map(s => `
                <div class="card signal-card ${s.action.toLowerCase()}" onclick="showDetails('${s.pair}')">
                    <div class="signal-header">
                        <span class="pair-name">${s.pair}</span>
                        <span class="action-badge ${s.action.toLowerCase()}">${s.action}</span>
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-fill ${s.confidence >= 65 ? 'high' : s.confidence >= 45 ? 'medium' : 'low'}"
                             style="width: ${s.confidence}%"></div>
                    </div>
                    <div style="text-align:center; font-size:14px; margin-bottom:10px;">
                        Confidence: <strong>${s.confidence}/100</strong>
                    </div>
                    <div class="signal-details">
                        <div class="row"><span class="label">Entry Price</span><span class="value">${s.entry_price.toLocaleString()}</span></div>
                        <div class="row"><span class="label">Stop-Loss</span><span class="value">${s.stop_loss.toLocaleString()}</span></div>
                        <div class="row"><span class="label">Target 1</span><span class="value">${s.take_profit_1.toLocaleString()}</span></div>
                        <div class="row"><span class="label">Target 2</span><span class="value">${s.take_profit_2.toLocaleString()}</span></div>
                        <div class="row"><span class="label">Risk/Reward</span><span class="value">1:${s.risk_reward}</span></div>
                        <div class="row"><span class="label">Buy/Sell Signals</span><span class="value">${s.buy_count}/${s.sell_count}</span></div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats(signals) {
            document.getElementById('totalSignals').textContent = signals.length;
            document.getElementById('buySignals').textContent = signals.filter(s => s.action === 'BUY').length;
            document.getElementById('sellSignals').textContent = signals.filter(s => s.action === 'SELL').length;
            const best = signals.reduce((a, b) => a.confidence > b.confidence ? a : b, signals[0]);
            document.getElementById('bestSignal').textContent = best ? `${best.confidence}%` : '-';
        }

        async function showDetails(pair) {
            try {
                const resp = await fetch(`/api/signal/${pair}`);
                const data = await resp.json();

                document.getElementById('detailsPair').textContent = pair;
                const list = document.getElementById('indicatorList');

                let html = '';
                if (data.indicators) {
                    html += data.indicators.map(i => `
                        <div class="indicator-item">
                            <span>${i.name}</span>
                            <span class="indicator-signal ${i.signal}">${i.signal}</span>
                        </div>
                    `).join('');
                }
                if (data.patterns && data.patterns.length > 0) {
                    html += '<div style="margin-top:10px; color:#58a6ff; font-weight:bold;">Patterns Detected:</div>';
                    html += data.patterns.map(p => `
                        <div class="indicator-item">
                            <span>${p.name} (${Math.round(p.confidence*100)}%)</span>
                            <span class="indicator-signal ${p.signal}">${p.signal}</span>
                        </div>
                    `).join('');
                }

                list.innerHTML = html;
                document.getElementById('detailsCard').style.display = 'block';
                document.getElementById('detailsCard').scrollIntoView({behavior: 'smooth'});
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
